version: '3'

services:
  timescale:
    # the HA image is the one production runs, and it brings timescaledb_toolkit, which
    # TestTimeWeightedMatchesToolkit compares against. The CI runs every tag production uses,
    # see .github/workflows/tests.yml.
    image: timescale/timescaledb-ha:${TIMESCALE_TAG:-pg18.7-ts2.32.1}
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 30

  test:
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    # queries_db_test.go executes generated queries against a real database. Without this the
    # test skips, and the difference-* queries are only covered as strings.
    environment:
      TEST_POSTGRES_DSN: postgres://postgres:pw@timescale:5432/test
      # fail rather than skip TestTimeWeightedMatchesToolkit if the image lacks the toolkit
      TEST_REQUIRE_TOOLKIT: "1"
    depends_on:
      timescale:
        condition: service_healthy
